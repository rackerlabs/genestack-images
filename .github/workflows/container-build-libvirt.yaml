---
name: Create and publish a libvirt image

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

on:
  pull_request:
    paths:
      - .github/workflows/container-build-libvirt.yaml
      - ContainerFiles/libvirt
      - docs/containers/libvirt.md
  schedule:
    - cron: '0 0 * * 0'  # Run Weekly at midnight UTC
  workflow_dispatch:
    inputs:
      openstack-version:
        description: 'Version of OpenStack to build against'
        required: true
        default: "stable/2025.1"
        type: choice
        options:
          - stable/2025.1
          - stable/2026.1

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  IMAGE_NAME: ${{ vars.HARBOR_PROJECT }}/libvirt
  CATEGORY_NAME: libvirt
  openstack_versions: >
    ["stable/2025.1", "stable/2026.1"]

jobs:
  init:
    runs-on:
      group: self-hosted-gh-runner
      labels: [self-hosted, Linux, X64]
    outputs:
      openstack-version: ${{ steps.generate-matrix.outputs.openstack_version }}
    steps:
      - name: generate-matrix
        id: generate-matrix
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            openstack_version="$(echo '${{ github.event.inputs.openstack-version }}' | jq -R '[select(length>0)]' | jq -c '.')"
          fi
          echo "openstack_version=${openstack_version:-${{ env.openstack_versions }}}" >> $GITHUB_OUTPUT
  build-and-push-image:
    needs:
      - init
    strategy:
      matrix:
        openstack-version: ${{ fromJSON(needs.init.outputs.openstack-version) }}
    runs-on:
      group: self-hosted-gh-runner
      labels: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Harbor configuration
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          missing=""
          [ -n "${REGISTRY}" ] || missing="${missing} vars.HARBOR_REGISTRY"
          [ -n "${{ vars.HARBOR_PROJECT }}" ] || missing="${missing} vars.HARBOR_PROJECT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            [ -n "${HARBOR_USERNAME}" ] || missing="${missing} secrets.HARBOR_USERNAME"
            [ -n "${HARBOR_PASSWORD}" ] || missing="${missing} secrets.HARBOR_PASSWORD"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing Harbor configuration:${missing} - see .github/harbor-setup.md"
            exit 1
          fi
      - name: Log in to Harbor
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Dynamically set MY_DATE environment variable
        run: echo "MY_DATE=$(date +%s)" >> $GITHUB_ENV
      - name: Normalize image repository name
        run: echo "IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Dynamically set OS_VERSION_PARSE environment variable
        run: |
          VERSION=$(echo -n "${{ matrix.openstack-version }}" | awk -F'/' '{($2=="" ? x=$1 : x=$2); print x}')
          echo "OS_VERSION_PARSE=${VERSION}" >> $GITHUB_ENV
          NAME=$(echo -n "${{ env.IMAGE_NAME }}" | awk -F'/' '{print $NF}')
          echo "CATEGORY_NAME=${VERSION}-${NAME}" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContainerFiles/libvirt
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:local-${{ github.run_id }}-${{ strategy.job-index }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OS_VERSION=${{ matrix.openstack-version }}
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0  # using latest trivy scanner
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local-${{ github.run_id }}-${{ strategy.job-index }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results to GitHub Security tab
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: "${{ env.CATEGORY_NAME }}"
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@0.35.0  # using latest trivy scanner
        if: ${{ github.event_name == 'pull_request' }}
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local-${{ github.run_id }}-${{ strategy.job-index }}'
          output: trivy.txt
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Create trivy output file in markdown format
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -s trivy.txt ]]; then
              echo "### Security Output" > trivy-output.txt
              echo '```terraform' >> trivy-output.txt
              cat trivy.txt >> trivy-output.txt
              echo '```' >> trivy-output.txt
          fi
      - name: Publish Trivy Output to Summary
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -s trivy-output.txt ]]; then
            {
              cat trivy-output.txt
            } >> $GITHUB_STEP_SUMMARY
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContainerFiles/libvirt
          push: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OS_VERSION_PARSE }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OS_VERSION_PARSE }}-${{ env.MY_DATE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OS_VERSION=${{ matrix.openstack-version }}
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove local image
        if: always()
        run: docker image rm -f "${IMAGE_NAME}:local-${{ github.run_id }}-${{ strategy.job-index }}" || true
