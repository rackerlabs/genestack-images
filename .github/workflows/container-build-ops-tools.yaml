---
name: Create and publish an ops-tools image

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write
  pull-requests: write
  security-events: write

on:
  pull_request:
    paths:
      - .github/workflows/container-build-ops-tools.yaml
      - ContainerFiles/ops-tools
      - scripts/ops-tools-cve-patching.sh
  schedule:
    - cron: '0 0 * * 0'  # Run Weekly at midnight UTC
  workflow_dispatch:
    inputs:
      genestack_repository:
        description: Genestack repository that provides ops-tools
        required: false
        default: rackerlabs/genestack
      genestack_ref:
        description: Genestack tag/ref that provides ops-tools
        required: false
        default: latest
        type: choice
        options:
          - latest
          - main
          - release-2026.2.0.2
          - release-2026.3.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ops-tools
  CATEGORY_NAME: ops-tools
  GENESTACK_REPOSITORY: ${{ github.event.inputs.genestack_repository || 'rackerlabs/genestack' }}
  GENESTACK_REF: ${{ github.event.inputs.genestack_ref || 'latest' }}

jobs:
  build-and-push-image:
    outputs:
      MY_DATE: ${{ steps.mydate.outputs.MY_DATE }}
      MY_CONTAINER: ${{ steps.mycontainer.outputs.MY_CONTAINER }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve Genestack ops-tools ref
        id: genestack-ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GENESTACK_REF}" == "latest" ]]; then
            resolved_ref="$(git ls-remote --tags --refs "https://github.com/${GENESTACK_REPOSITORY}.git" \
              | awk '{print $2}' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -n 1)"
            if [[ -z "${resolved_ref}" ]]; then
              echo "Unable to resolve latest tag from ${GENESTACK_REPOSITORY}" >&2
              exit 1
            fi
          else
            resolved_ref="${GENESTACK_REF}"
          fi
          echo "ref=${resolved_ref}" >> "${GITHUB_OUTPUT}"
          echo "Using ${GENESTACK_REPOSITORY}@${resolved_ref} for ops-tools"
      - name: Checkout Genestack ops-tools source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GENESTACK_REPOSITORY }}
          ref: ${{ steps.genestack-ref.outputs.ref }}
          path: genestack-source
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Dynamically set MY_DATE environment variable
        run: echo "MY_DATE=$(date +%s)" >> $GITHUB_ENV
      - name: Normalize image repository name
        run: echo "IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContainerFiles/ops-tools
          build-contexts: |
            genestack-source=./genestack-source
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GENESTACK_REF=${{ steps.genestack-ref.outputs.ref }}
            CACHEBUST=${{ github.sha }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results to GitHub Security tab
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: "${{ env.CATEGORY_NAME }}"
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@0.35.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          image-ref: '${{ env.IMAGE_NAME }}:local'
          output: trivy.txt
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Create trivy output file in markdown format
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -s trivy.txt ]]; then
              echo "### Security Output" > trivy-output.txt
              echo '```terraform' >> trivy-output.txt
              cat trivy.txt >> trivy-output.txt
              echo '```' >> trivy-output.txt
          fi
      - name: Publish Trivy Output to Summary
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -s trivy-output.txt ]]; then
            {
              cat trivy-output.txt
            } >> $GITHUB_STEP_SUMMARY
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ContainerFiles/ops-tools
          build-contexts: |
            genestack-source=./genestack-source
          push: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.MY_DATE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GENESTACK_REF=${{ steps.genestack-ref.outputs.ref }}
            CACHEBUST=${{ github.sha }}
