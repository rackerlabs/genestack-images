---
name: Build and Push Blazar Reservation Splitter Image to Harbor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/blazar-reservation-splitter.yaml
      - ContainerFiles/blazar-reservation-splitter
      - scripts/blazar-reservation-splitter-app/**
  pull_request:
    paths:
      - .github/workflows/blazar-reservation-splitter.yaml
      - ContainerFiles/blazar-reservation-splitter
      - scripts/blazar-reservation-splitter-app/**

jobs:
  build-and-push:
    runs-on:
      group: self-hosted-gh-runner
      labels: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Check Harbor configuration
      env:
        HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      run: |
        missing=""
        [ -n "${{ vars.HARBOR_REGISTRY }}" ] || missing="${missing} vars.HARBOR_REGISTRY"
        [ -n "${{ vars.HARBOR_PROJECT }}" ] || missing="${missing} vars.HARBOR_PROJECT"
        if [ "${{ github.event_name }}" = "push" ]; then
          [ -n "${HARBOR_USERNAME}" ] || missing="${missing} secrets.HARBOR_USERNAME"
          [ -n "${HARBOR_PASSWORD}" ] || missing="${missing} secrets.HARBOR_PASSWORD"
        fi
        if [ -n "${missing}" ]; then
          echo "::error::Missing Harbor configuration:${missing} - see .github/harbor-setup.md"
          exit 1
        fi

    - name: Log in to Harbor
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: docker/login-action@v2
      with:
        registry: ${{ vars.HARBOR_REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/blazar-reservation-splitter
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ContainerFiles/blazar-reservation-splitter
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
