---
name: Build and Push Opentelemetry k8s custom image to Harbor

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

on:
  pull_request:
    paths:
      - .github/workflows/opentelemetry-k8s-custom-build.yaml
      - manifests/opentelemetry-k8s-custom-manifest.yaml
  schedule:
    - cron: '0 0 * * 0'  # Run Weekly at midnight UTC
  workflow_dispatch:
    inputs:
      otel-version:
        description: 'Version of Opentelemetry collector to use'
        required: true
        default: "0.144.0"
        type: choice
        options:
          - 0.144.0

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  IMAGE_NAME: ${{ vars.HARBOR_PROJECT }}/otel-flex-collector
  OT_VERSION: 0.0.1

jobs:
  build-collector-and-push:
    runs-on:
      group: self-hosted-gh-runner
      labels: [self-hosted, Linux, X64]

    steps:
    - name: Dynamically set MY_DATE environment variable
      run: echo "MY_DATE=$(date +%s)" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check Harbor configuration
      env:
        HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      run: |
        missing=""
        [ -n "${REGISTRY}" ] || missing="${missing} vars.HARBOR_REGISTRY"
        [ -n "${{ vars.HARBOR_PROJECT }}" ] || missing="${missing} vars.HARBOR_PROJECT"
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          [ -n "${HARBOR_USERNAME}" ] || missing="${missing} secrets.HARBOR_USERNAME"
          [ -n "${HARBOR_PASSWORD}" ] || missing="${missing} secrets.HARBOR_PASSWORD"
        fi
        if [ -n "${missing}" ]; then
          echo "::error::Missing Harbor configuration:${missing} - see .github/harbor-setup.md"
          exit 1
        fi

    - name: Build and Package Collector
      uses: observiq/otel-distro-builder@v1
      with:
        manifest: "manifests/opentelemetry-k8s-custom-manifest.yaml"
        platforms: "linux/amd64"
        create_release: false
        upload_artifacts: true

    - name: Load pre-built Docker image from file
      run: |
        docker import ./artifacts/otel-flex-collector_v0.0.0-SNAPSHOT-none_linux_amd64.tar.gz ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-latest
        docker import ./artifacts/otel-flex-collector_v0.0.0-SNAPSHOT-none_linux_amd64.tar.gz ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-${{ env.MY_DATE }}

    - name: Log in to Harbor
      if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Docker push otel-flex-collector image
      if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-${{ env.MY_DATE }}

    - name: Remove local images
      if: always()
      run: |
        docker image rm -f \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-latest" \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.OT_VERSION }}-${{ env.MY_DATE }}" || true
